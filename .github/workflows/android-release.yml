name: Build and Release Android Widget APK

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. android-v1.0.0)'
        required: true
        default: 'android-v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        working-directory: android
        run: |
          set -e
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee ../build.log || {
            echo "## Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 ../build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Rename APK
        run: |
          mkdir -p output
          find android/app/build/ -name "*.apk" -exec cp {} output/NTU-Course-Calendar-Widget.apk \;
          ls -la output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version_tag }}
          name: "Android 課表小工具 App ${{ github.ref_name || inputs.version_tag }}"
          body: |
            ## 臺大課表好朋友 Android 原生小工具 App

            專為臺大學生打造的桌面課表微件。

            ### 核心規格
            - 2D 週課表矩陣：左側時間節次軸、頂部星期欄、跨節課程卡片與當日高亮。
            - 今日節次功課表：即時掌握當日課堂時程、教室地點與進行中狀態。
            - 官方英文版與雙語支援：頂部提供中英切換按鈕，2D 週課表與桌面小工具自動即時渲染 NTU 官方英文課名與英文時程。
            - 網頁端一鍵同步：支援從「臺大課程日曆好朋友」網頁一鍵同步個人課表。
            - 原生架構：使用 Google Jetpack Compose Glance 開發，免付費亦無須安裝第三方載具。

            ### 安裝與使用說明
            1. 下載下方的 NTU-Course-Calendar-Widget.apk 檔案並安裝至 Android 裝置。
            2. 開啟 App，可點擊頂部「🌐 中文 / 🌐 EN」自由切換語系。
            3. 點選「開啟課程網頁」同步課表或「貼上匯入代碼」匯入。
            4. 回到手機桌面長按空白處，選擇「微件 / 小工具」，搜尋「臺大課表好朋友」即可新增 2D 週課表或今日節次課表。
          files: |
            output/NTU-Course-Calendar-Widget.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
